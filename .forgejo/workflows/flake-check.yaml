on: [push]
enable-email-notifications: true
jobs:
  check:
    strategy:
      matrix:
        os: [ node-lts, macos ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: https://github.com/DeterminateSystems/nix-installer-action@main
        if: matrix.os == 'node-lts'
      - name: Configure rex credentials
        env:
          REX_TOKEN: ${{ secrets.REX_TOKEN }}
        run: |
          umask 077
          printf 'machine pkgs.superlogical.com login rex password %s\n' "$REX_TOKEN" > "$RUNNER_TEMP/rex.netrc"
          echo "NIX_CONFIG=netrc-file = $RUNNER_TEMP/rex.netrc" >> "$GITHUB_ENV"
      - run: nix flake check
